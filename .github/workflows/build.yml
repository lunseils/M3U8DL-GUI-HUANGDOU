name: 编译与发布

# 触发规则
#   推送到 main   → 编译 + 全量回归测试 + 自动递增版本号 + 发一个 Release
#   推送 v* 标签  → 同上，但版本号取标签名（用于发正式版）
#   PR 到 main    → 只编译 + 测试，不发版
#   手动触发      → 走 main 的自动递增逻辑
#
# 只想在打标签时发版？把下面 push.branches 那两行删掉即可。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 同一分支的旧运行自动取消，省时间；但 release 阶段另有独立锁，见下方 job
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 编译与测试
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 编译全部项目
        shell: pwsh
        run: dotnet build M3U8DL.sln -c Release --nologo

      # 测试会往 PATH 里注入假引擎，需要先把 FakeDownloader 发布成单文件
      - name: 发布假下载引擎（测试用）
        shell: pwsh
        run: >
          dotnet publish Fake/Fake.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o Fake/publish

      - name: 编译回归测试
        shell: pwsh
        run: dotnet build M3U8DL.Tests/M3U8DL.Tests.csproj -c Release --nologo

      # 自建断言框架，编译成控制台程序直接跑；失败时非零退出码
      - name: 运行全量回归测试
        shell: pwsh
        env:
          FAKE_EXE: ${{ github.workspace }}\Fake\publish\FakeDownloader.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # 让子进程的中文输出不变成乱码
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $exe = 'M3U8DL.Tests\bin\Release\net10.0-windows\M3U8DL.Tests.exe'
          if (-not (Test-Path $exe)) { throw "找不到测试程序：$exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "回归测试失败，退出码 $LASTEXITCODE" }

      - name: 计算版本号
        id: ver
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          if ($env:EVENT -eq 'pull_request') {
            Write-Host 'PR 只验证，不发布，跳过版本计算'
            "version=0.0.0" >> $env:GITHUB_OUTPUT
            "tag=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($env:REF_TYPE -eq 'tag') {
            # 手推标签：v1.2.3 → 1.2.3
            $tag = $env:REF_NAME
            $ver = $tag -replace '^[vV]', ''
            Write-Host "使用标签版本：$ver"
          } else {
            # 自动递增：取历史 Release 里最大的语义化版本，补丁号 +1
            $best = $null
            $raw = gh api "repos/$env:REPO/releases?per_page=100" 2>$null
            if ($LASTEXITCODE -eq 0 -and $raw) {
              foreach ($r in ($raw | ConvertFrom-Json)) {
                if ($r.tag_name -match '^[vV]?(\d+)\.(\d+)\.(\d+)$') {
                  $v = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
                  if ($null -eq $best -or $v -gt $best) { $best = $v }
                }
              }
            }
            if ($null -eq $best) {
              $ver = '1.0.0'
            } else {
              $ver = '{0}.{1}.{2}' -f $best.Major, $best.Minor, ($best.Build + 1)
            }
            $tag = "v$ver"
            Write-Host "上一个版本：$(if ($null -eq $best) { '无' } else { $best })，本次：$ver"
          }

          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 发布单文件程序
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet publish M3U8DL/M3U8DL.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw '发布失败' }
          $f = Get-Item publish/M3U8DL.exe
          Write-Host ("产物：{0}（{1:N2} MB）" -f $f.Name, ($f.Length / 1MB))
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 `
            -Value ("单文件体积：{0:N2} MB" -f ($f.Length / 1MB))

      - name: 上传构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: m3u8dl-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布到 Releases
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # 发布必须串行：两个 push 同时跑会抢同一个版本号（先算后查，谁都不知道对方）
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: 检出代码（取 README 与 LICENSE 一起打包）
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: m3u8dl-win-x64
          path: dist

      - name: 打包与校验和
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $ver = $env:VERSION
          $zip = "M3U8DL-$ver-win-x64.zip"

          New-Item -ItemType Directory out -Force | Out-Null
          Copy-Item README.md, LICENSE -Destination dist -Force
          # 只压这三个文件，避免把正在写入的 zip 自己卷进去
          Compress-Archive -Path dist/M3U8DL.exe, dist/README.md, dist/LICENSE `
            -DestinationPath "out/$zip" -CompressionLevel Fastest

          Get-FileHash dist/M3U8DL.exe, "out/$zip" -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path out/SHA256SUMS.txt -Encoding utf8

          Get-ChildItem out, dist -File | ForEach-Object {
            Write-Host ("{0}  {1:N2} MB" -f $_.Name, ($_.Length / 1MB))
          }

      - name: 生成 Release 说明
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $ver = $env:VERSION
          $short = $env:SHA.Substring(0, 7)
          $subject = (git log -1 --pretty=format:'%s')
          $when = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')

          $body = @"
          ## M3U8DL GUI v$ver

          自动构建于 $when UTC，提交 ``$short``（$env:ACTOR）。

          **本次提交**：$subject

          ### 下载

          | 文件 | 说明 |
          | --- | --- |
          | ``M3U8DL.exe`` | 单文件自包含版本，双击即用，**不需要**预先安装 .NET 运行时 |
          | ``M3U8DL-$ver-win-x64.zip`` | 同上，附带 README 与 LICENSE |
          | ``SHA256SUMS.txt`` | 校验和，可用 ``certutil -hashfile 文件名 SHA256`` 核对 |

          ### 还需要自备的组件

          本程序只是图形外壳，不打包第三方二进制：

          - ``N_m3u8DL-RE.exe`` —— 必需
          - ``yt-dlp.exe`` —— 可选，使用 yt-dlp 引擎时需要
          - ``ffmpeg.exe`` —— 可选，合并音视频轨或转封装时需要

          把它们放进 PATH 或程序所在目录，也可以在设置页手动指定路径。

          ### 系统要求

          Windows 10 1809 及以上 / Windows 11，x64。
          "@

          # 去掉 here-string 的公共缩进，否则 Markdown 会渲染成代码块
          $body = ($body -split "`r?`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          Set-Content -Path notes.md -Value $body -Encoding utf8

      - name: 创建 Release
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:TAG
          $ver = $env:VERSION

          # 幂等：重跑 workflow 时先删掉同名 Release（保留 tag，下面 create 会复用）
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "已存在 Release $tag，先删除以便重建"
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "删除旧 Release 失败" }
          }

          gh release create $tag `
            dist/M3U8DL.exe `
            "out/M3U8DL-$ver-win-x64.zip" `
            out/SHA256SUMS.txt `
            --title "M3U8DL GUI v$ver" `
            --notes-file notes.md `
            --target $env:SHA `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败，退出码 $LASTEXITCODE" }

          Write-Host "已发布：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag"
